<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5F4F8; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.8" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.2" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="chores" data-composition-id="chores" data-composition-src="compositions/chores.html"
        data-start="2.2" data-duration="2.5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="idea" data-composition-id="idea" data-composition-src="compositions/idea.html"
        data-start="4.7" data-duration="2.6" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="poster" data-composition-id="poster" data-composition-src="compositions/poster.html"
        data-start="7.3" data-duration="2.5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="publish" data-composition-id="publish" data-composition-src="compositions/publish.html"
        data-start="9.8" data-duration="3.0" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="12.8" data-duration="3.0" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
