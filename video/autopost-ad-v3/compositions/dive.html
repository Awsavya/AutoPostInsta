  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="dive"]');
      var q = function (sel) { return root.querySelector(sel); };
      var phoneLayer = q("#dive-phone-layer");
      var heroLayer = q("#dive-hero-layer");
      var col = q("#dive-col");
      var heroShadow = q("#dive-hero-shadow");
      var words = root.querySelectorAll(".dive-word");

      // ---- geometry (world px == frame px on the last frame) ----
      var K = 480 / 1080;                  // phone screen at rest is 480 px wide
      var A = { x: 540, y: 745 };          // anchor: centre of the 01 Idea card
      var SCREEN_TOP_REST = 600;           // frame y of the screen top at rest
      var F0 = { x: 540, y: SCREEN_TOP_REST + K * (A.y - 120) };
      var RISE_FROM = 640;                 // phone starts this far below its rest place
      var RATIO = { phone: 1.0, col: 1.15, hero: 1.3 };
      var DIVE_END = 44 / 30;              // last rendered frame of this slot (abs 4.9667) is the handoff frame

      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      // One-overshoot spring, closed form: lands exactly on 1 at u = 1 (~5% overshoot).
      function springRise(u) {
        if (u >= 1) return 1;
        return 1 - Math.exp(-4.5 * u) * Math.cos(1.5 * Math.PI * u);
      }
      function sineInOut(v) { return -(Math.cos(Math.PI * v) - 1) / 2; }

      function layerMap(p, r, extra, riseY, riseS) {
        var pr = 1 - Math.pow(1 - p, r);
        var s = Math.pow(K, 1 - pr);
        var qq = (s - K) / (1 - K);
        return {
          ax: F0.x + (A.x - F0.x) * qq,
          ay: F0.y + (A.y - F0.y) * qq + riseY,
          S: s * extra * riseS
        };
      }
      function setMap(el, m) {
        el.style.transform =
          "translate(" + (m.ax - m.S * A.x).toFixed(3) + "px," + (m.ay - m.S * A.y).toFixed(3) + "px) scale(" + m.S.toFixed(5) + ")";
      }

      function render(t) {
        // Phone rise 0.00-0.40 on a spring with one overshoot.
        var e = springRise(clamp01(t / 0.4));
        var riseY = RISE_FROM * (1 - e);
        var riseS = 0.94 + 0.06 * e;
        // Dive 0.75-1.4667, sine.inOut, ends at rest on the last rendered frame.
        var p = sineInOut(clamp01((t - 0.75) / (DIVE_END - 0.75)));

        var phoneExtra = 1 + 0.5 * Math.pow(p, 3);        // bezel flies past the lens late
        var heroExtra = 1 + 0.11 * Math.sin(Math.PI * p);   // hero card lifts off the glass mid-push
        var mp = layerMap(p, RATIO.phone, phoneExtra, riseY, riseS);
        var mc = layerMap(p, RATIO.col, 1, riseY, riseS);
        var mh = layerMap(p, RATIO.hero, heroExtra, riseY, riseS);

        setMap(phoneLayer, mp);
        setMap(heroLayer, mh);

        // Column lives inside the screen (clipped); express its map relative to the phone.
        var R = mc.S / mp.S;
        var dx = (mc.ax - mp.ax) / mp.S;
        var dy = (mc.ay - mp.ay) / mp.S;
        col.style.transform =
          "translate(" + (A.x + dx - R * A.x).toFixed(3) + "px," + (A.y + dy - R * A.y).toFixed(3) + "px) scale(" + R.toFixed(5) + ")";

        heroShadow.style.opacity = Math.sin(Math.PI * p).toFixed(4);
      }

      var tl = gsap.timeline({ paused: true });
      var clock = { t: 0 };
      tl.to(clock, { t: 1.5, duration: 1.5, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      // Headline: per-word rise 0.05-~0.6 (expo.out, 2-frame stagger), still, exit up at 0.80.
      tl.fromTo(
        words,
        { y: 70, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out", stagger: 0.067 },
        0.05
      );
      tl.to(words, { y: -110, opacity: 0, duration: 0.22, ease: "power3.in", stagger: 0.012 }, 0.8);

      // Topbar logo leaves the bar while the camera pushes, so the bar is empty on the handoff frame.
      tl.fromTo(q("#dive-bar-logo"), { y: 0 }, { y: -110, duration: 0.24, ease: "power3.in" }, 0.92);

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["dive"] = tl;
    })();
  </script>
