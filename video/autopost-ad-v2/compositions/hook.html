<template>
  <style>
    @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #FFC83D; overflow: hidden; }
    #hook-cam { position: absolute; inset: 0; }
    #hook-text { position: absolute; left: 120px; top: 560px; width: 780px; font: 800 118px/1.0 "Archivo", sans-serif;
      letter-spacing: -0.025em; color: #15131C; }
    #hook-text .line { display: block; }
    #hook-word { position: relative; display: inline-block; z-index: 1; }
    #hook-word-text { position: relative; z-index: 2; }
    #hook-bar { position: absolute; left: -14px; right: -14px; top: 6px; bottom: -10px; background: #15131C; border-radius: 10px; z-index: 1; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-cam" class="clip" data-start="0" data-duration="2" data-layout-allow-overlap data-layout-allow-overflow>
      <div id="hook-text">
        <span class="line">Still posting</span>
        <span class="line">on Instagram</span>
        <span class="line"><span id="hook-word"><span id="hook-word-text">yourself?</span><i id="hook-bar"></i></span></span>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Frame 0 is the thumbnail: the whole line is already on screen.
    // Beat 0.5: the ink bar wipes behind "yourself?" and the word flips to yellow.
    tl.fromTo("#hook-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 0.5);
    tl.fromTo("#hook-word-text", { color: "#15131C" }, { color: "#FFC83D", duration: 0.08, ease: "none" }, 0.56);
    // Beat 1.0: one camera punch, then still.
    tl.fromTo("#hook-cam", { scale: 1, transformOrigin: "40% 40%" }, { scale: 1.05, duration: 0.12, ease: "power3.out" }, 1.0);
    tl.to("#hook-cam", { scale: 1.03, duration: 0.3, ease: "power2.out" }, 1.12);
    // 1.5-2.0: the bar floods the frame and becomes the next scene's ink ground.
    tl.to("#hook-bar", { scaleX: 14, scaleY: 34, borderRadius: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.in" }, 1.5);
    tl.fromTo("#hook-word-text", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 1.75);
    window.__timelines["hook"] = tl;
  </script>
</template>
