<template>
  <style>
    @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #15131C; overflow: hidden; }
    #chores-all { position: absolute; inset: 0; }
    #chores-cam { position: absolute; inset: 0; }
    .chore { position: absolute; left: 150px; width: 700px; display: flex; align-items: center; gap: 26px;
      background: #FCFBFE; color: #15131C; border-radius: 24px; padding: 30px 36px;
      font: 650 50px/1.1 "Archivo", sans-serif; letter-spacing: -0.01em; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
    .chore i { flex: none; width: 44px; height: 44px; border: 4px solid #A9A5B5; border-radius: 50%; }
    #chores-days { position: absolute; left: 120px; top: 930px; width: 780px; font: 800 112px/1.0 "Archivo", sans-serif;
      letter-spacing: -0.025em; color: #FFC83D; }
    #chores-days span { display: block; }
  </style>
  <div id="root" data-composition-id="chores" data-width="1080" data-height="1920">
    <div id="chores-all" class="clip" data-start="0" data-duration="4" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow>
      <div id="chores-cam">
        <div id="chore-1" class="chore" style="top: 330px"><i></i>Think of an idea</div>
        <div id="chore-2" class="chore" style="top: 470px"><i></i>Make the image</div>
        <div id="chore-3" class="chore" style="top: 610px"><i></i>Write the caption</div>
        <div id="chore-4" class="chore" style="top: 750px"><i></i>Post it on time</div>
        <div id="chores-days">
          <span id="day-w1">Every.</span><span id="day-w2">Single.</span><span id="day-w3">Day.</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const tilt = [-3, 2.5, -1.5, 3.5];
    const lands = [0.5, 1.0, 1.25, 1.5]; // on the beat, then the eighths: the pile speeds up
    // Each chore falls (accelerating, like gravity) and lands on its beat; the pile jolts on each landing.
    lands.forEach((t, i) => {
      tl.fromTo(`#chore-${i + 1}`, { y: -760, rotation: tilt[i] * 4, opacity: 0, filter: "blur(8px)" },
        { y: 0, rotation: tilt[i], opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.in" }, t - 0.3);
      tl.fromTo("#chores-cam", { y: 0 }, { y: 10, duration: 0.05, ease: "power2.out" }, t);
      tl.to("#chores-cam", { y: 0, duration: 0.16, ease: "power2.out" }, t + 0.05);
    });
    // "Every. Single. Day." slams on beats 2.0 / 2.5 / 3.0, each with a camera punch.
    [2.0, 2.5, 3.0].forEach((t, i) => {
      tl.fromTo(`#day-w${i + 1}`, { scale: 1.7, opacity: 0, filter: "blur(10px)", transformOrigin: "0% 50%" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, t);
      tl.fromTo("#chores-cam", { scale: 1 }, { scale: 1.035, duration: 0.06, ease: "power2.out", transformOrigin: "50% 45%" }, t);
      tl.to("#chores-cam", { scale: 1, duration: 0.3, ease: "power2.out" }, t + 0.06);
    });
    // 3.5-3.75: the break. Everything holds dead still. 3.75-4.0: whip up into the app.
    tl.fromTo("#chores-all", { y: 0, filter: "blur(0px)" }, { y: -1500, filter: "blur(18px)", duration: 0.25, ease: "power3.in" }, 3.75);
    window.__timelines["chores"] = tl;
  </script>
</template>
